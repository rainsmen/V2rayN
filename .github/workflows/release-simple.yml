name: release (no-sign)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - target: windows
            project: ./v2rayN/v2rayN.csproj
            os: windows-latest
            ext: zip
            extra-opts: '-p:EnableWindowsTargeting=true'
          - target: linux
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
            os: ubuntu-24.04
            ext: tar.gz
            extra-opts: ''
          - target: osx
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
            os: macos-latest
            ext: tar.gz
            extra-opts: ''
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.1xx'

    - name: Build v2rayN
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.target }}-x64 -p:SelfContained=true ${{ matrix.extra-opts }} -o release

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r ${{ matrix.target }}-x64 -p:SelfContained=true -p:PublishTrimmed=true ${{ matrix.extra-opts }} -o release

    - name: Remove debug symbols
      shell: bash
      run: find release -type f -name '*.pdb' -delete 2>/dev/null; true

    - name: Package
      shell: bash
      run: |
        cd v2rayN
        tar -czf v2rayN-${{ matrix.target }}-x64.tar.gz -C release .
        # Also create zip for windows
        if [ "${{ matrix.target }}" = "windows" ]; then
          cd release && 7z a -tZip ../../v2rayN/v2rayN-${{ matrix.target }}-x64.zip . && cd ..
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        files: |
          v2rayN/v2rayN-${{ matrix.target }}-x64.tar.gz
          v2rayN/v2rayN-${{ matrix.target }}-x64.zip
        body: |
          See [README](https://github.com/rainsmen/V2rayN#readme) for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
