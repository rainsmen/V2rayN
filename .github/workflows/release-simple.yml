name: release (no-sign)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            rid: win-x64
            project: ./v2rayN/v2rayN.csproj
            os: windows-latest
            out_name: v2rayN-windows-64.zip
            extra-opts: '-p:EnableWindowsTargeting=true'
          - target: linux
            rid: linux-x64
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
            os: ubuntu-24.04
            out_name: v2rayN-linux-64.zip
            extra-opts: ''
          - target: osx
            rid: osx-x64
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
            os: macos-latest
            out_name: v2rayN-macos-64.zip
            extra-opts: ''
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Purge SDKs
      shell: pwsh
      run: |
        dotnet --list-sdks | ForEach-Object {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.1xx'

    - name: Build v2rayN
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.rid }} -p:SelfContained=true ${{ matrix.extra-opts }} -o release

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:PublishTrimmed=true ${{ matrix.extra-opts }} -o release

    - name: Embed sing-box Core & Geo Assets
      shell: bash
      working-directory: ./v2rayN
      run: |
        SING_TAG=$(curl -sI https://github.com/SagerNet/sing-box/releases/latest | grep -i "^location:" | sed -E 's/.*tag\/(v[0-9.]+).*/\1/' | tr -d '\r\n')
        SING_VER="${SING_TAG#v}"
        SING_VER="${SING_VER:-1.14.0}"
        echo "Using sing-box version: ${SING_VER}"
        mkdir -p release/bin/sing_box release/bin/srss
        if [ "${{ matrix.target }}" = "windows" ]; then
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${SING_VER}/sing-box-${SING_VER}-windows-amd64.zip" -o sing-box.zip
          7z e sing-box.zip "sing-box-*/sing-box.exe" -orelease/bin/sing_box/ -y
          7z e sing-box.zip "sing-box-*/libcronet.dll" -orelease/bin/sing_box/ -y || true
          CRONET=$(7z l sing-box.zip | grep -io 'libcronet[^ ]*\.dll' | head -n1 || true)
          if [ -z "$CRONET" ]; then echo "WARNING: libcronet.dll not in sing-box windows archive"; ls -l release/bin/sing_box/ || true; fi
          rm -f sing-box.zip
        elif [ "${{ matrix.target }}" = "linux" ]; then
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${SING_VER}/sing-box-${SING_VER}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz -C release/bin/sing_box/
          mv release/bin/sing_box/sing-box-*/sing-box release/bin/sing_box/sing-box || true
          find release/bin/sing_box -name 'libcronet*' -exec mv {} release/bin/sing_box/libcronet.so \; || true
          rm -rf release/bin/sing_box/sing-box-*
          chmod +x release/bin/sing_box/sing-box
          rm -f sing-box.tar.gz
        elif [ "${{ matrix.target }}" = "osx" ]; then
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${SING_VER}/sing-box-${SING_VER}-darwin-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz -C release/bin/sing_box/
          mv release/bin/sing_box/sing-box-*/sing-box release/bin/sing_box/sing-box || true
          rm -rf release/bin/sing_box/sing-box-*
          chmod +x release/bin/sing_box/sing-box
          rm -f sing-box.tar.gz
        fi

        curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat" -o release/bin/geoip.dat || true
        curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat" -o release/bin/geosite.dat || true

        for r in geosite-category-ads-all geosite-category-ads geosite-cn geosite-geolocation-cn; do
          curl -fsSL "https://raw.githubusercontent.com/2dust/sing-box-rules/rule-set-geosite/${r}.srs" -o "release/bin/srss/${r}.srs" || true
        done
        for r in geoip-cn geoip-private; do
          curl -fsSL "https://raw.githubusercontent.com/2dust/sing-box-rules/rule-set-geoip/${r}.srs" -o "release/bin/srss/${r}.srs" || true
        done

        # Clean up any zero or tiny corrupted error pages (< 32 bytes)
        python3 -c "import os, glob; [os.remove(f) for f in glob.glob('release/bin/srss/*') if os.path.isfile(f) and os.path.getsize(f) < 32]" 2>/dev/null || true

    - name: Remove debug symbols
      shell: bash
      working-directory: ./v2rayN
      run: |
        find release -type f -name '*.pdb' -delete 2>/dev/null || true

    - name: Package
      shell: bash
      working-directory: ./v2rayN
      run: |
        cd release && 7z a -tZip -mx=9 ../${{ matrix.out_name }} . && cd ..

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        files: |
          v2rayN/${{ matrix.out_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
